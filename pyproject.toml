[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent_runtime"
version = "0.1.8"
description = "Reusable agent automation core for repository workflows"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
agent_runtime = "agent_runtime.cli:main"
ralph = "agent_runtime.cli:main"

[project.optional-dependencies]
codex = ["requests", "python-dotenv"]
claude = ["anthropic", "python-dotenv"]
watch = ["watchdog"]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_runtime = ["templates/project/**/*"]

