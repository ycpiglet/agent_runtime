[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent_runtime"
version = "0.3.0"
description = "Reusable agent automation core for repository workflows"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
agent_runtime = "agent_runtime.cli:main"
ralph = "agent_runtime.cli:main"

[project.optional-dependencies]
codex = ["requests", "python-dotenv"]
claude = ["anthropic", "python-dotenv"]
watch = ["watchdog"]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# TASK-AR-531 (GH #121): on older setuptools (<=62, what the host hit) the `**/*`
# glob silently DROPS dot-prefixed paths, so a `pip install` host never received
# the template wiring (.gitattributes / .githooks / .github / .codex). Newer
# setuptools ships them, but the build floor does not pin a version, so enumerate
# the dot-paths explicitly -> correct + identical across ALL setuptools versions.
# Verified by scripts/verify_wheel_dotfiles.py (built-wheel content assertion).
agent_runtime = [
    "templates/project/**/*",
    "templates/project/.gitattributes",
    "templates/project/.githooks/**/*",
    "templates/project/.github/**/*",
    "templates/project/.codex/**/*",
    "templates/project/**/.gitkeep",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]

