# Metric-bound noncritical auto-release for agent_runtime (TASK-AR-586, redesign).
#
# Trigger: fires right after the `test` workflow completes successfully on main
# (workflow_run) -- i.e. as soon as a CI-validated green main SHA exists, driven by
# accumulated change rather than a weekly clock. A weekly cron (Mon 02:00 UTC) is kept
# as a fallback heartbeat, and it can be dispatched manually for a dry-run preview.
#
# What it does: runs scripts/release_auto_noncritical.py, which proceeds to execute a
# release WITHOUT Owner approval ONLY when the agent release council can: the cadence
# proposal has fired, the recommended bump is patch/noncritical, there are NO
# CRITICAL_FLAGS, and the SHA it acts on is the CI-validated green one. Any minor /
# major_or_breaking / secret / destructive release halts with owner-approval-required
# and mutates nothing (the Owner is notified to approve).
#
# SHA safety (relaxed from "== current main HEAD" to "the CI-validated green SHA"):
#   - On workflow_run we release github.event.workflow_run.head_sha, the exact SHA the
#     just-completed green `test` run validated. We CHECK OUT that SHA, so the tag is cut
#     at validated code even if main has merged further since (a tag is a fixed pointer).
#   - On schedule/dispatch we resolve the latest completed `test` run on main and act on
#     its head SHA. The orchestrator re-checks (head_sha == --validated-sha) as
#     defense-in-depth; because we check out the validated SHA, that holds.
#
# By default this runs in --execute mode on the validated green SHA. Manual dispatch can
# force a dry-run via the `dry_run` input (plan + notify, no real git tag/push).
name: release-auto

on:
  workflow_run:
    workflows: ["test"]
    types: [completed]
  schedule:
    # Fallback cadence heartbeat: Monday 02:00 UTC. The primary trigger is workflow_run.
    - cron: "0 2 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Plan + notify only; perform no real git tag/push"
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  actions: read
  issues: write

concurrency:
  group: release-auto
  cancel-in-progress: false

jobs:
  noncritical-auto-release:
    # On workflow_run, only proceed for a SUCCESSFUL `test` run on main; schedule and
    # manual dispatch always enter and let the resolve step validate.
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - name: Resolve the CI-validated green SHA to release
        id: validated
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          WF_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            # The job `if` already required a successful `test` run on main; release that
            # exact CI-validated SHA.
            echo "Releasing CI-validated workflow_run SHA: $WF_RUN_SHA"
            echo "ci_status=green" >> "$GITHUB_OUTPUT"
            echo "validated_sha=$WF_RUN_SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # schedule / workflow_dispatch: resolve the latest completed `test` run on main.
          run_json="$(gh run list --repo "$REPO" --workflow test.yml --branch main \
                        --status completed --limit 1 \
                        --json headSha,conclusion --jq '.[0] // empty')"
          if [ -z "$run_json" ]; then
            echo "No completed test run on main; refusing to auto-release." >&2
            echo "ci_status=unknown" >> "$GITHUB_OUTPUT"
            echo "validated_sha=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          conclusion="$(printf '%s' "$run_json" | jq -r '.conclusion')"
          validated_sha="$(printf '%s' "$run_json" | jq -r '.headSha')"
          echo "Latest completed test run on main: sha=$validated_sha conclusion=$conclusion"
          if [ "$conclusion" = "success" ]; then
            echo "ci_status=green" >> "$GITHUB_OUTPUT"
          else
            echo "ci_status=$conclusion" >> "$GITHUB_OUTPUT"
          fi
          echo "validated_sha=$validated_sha" >> "$GITHUB_OUTPUT"

      - name: Checkout the validated SHA at full history (tags + cadence range)
        if: steps.validated.outputs.ci_status == 'green' && steps.validated.outputs.validated_sha != ''
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.validated.outputs.validated_sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        if: steps.validated.outputs.ci_status == 'green' && steps.validated.outputs.validated_sha != ''
        with:
          python-version: "3.12"

      - name: Run noncritical auto-release orchestrator (validated green SHA)
        id: orchestrate
        if: steps.validated.outputs.ci_status == 'green' && steps.validated.outputs.validated_sha != ''
        env:
          PYTHONPATH: src
          CI_STATUS: ${{ steps.validated.outputs.ci_status }}
          VALIDATED_SHA: ${{ steps.validated.outputs.validated_sha }}
          # Default to a real execute on the validated SHA; dispatch can force dry-run.
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
        run: |
          set -euo pipefail
          if [ "$CI_STATUS" != "green" ] || [ -z "$VALIDATED_SHA" ]; then
            echo "main CI is not green for a validated SHA (ci_status=$CI_STATUS); not releasing."
            exit 0
          fi
          args=(scripts/release_auto_noncritical.py
                --ci-status "$CI_STATUS"
                --validated-sha "$VALIDATED_SHA"
                --out-dir .tmp/release-auto
                --json)
          if [ "$DRY_RUN" = "true" ]; then
            args+=(--dry-run)
          else
            args+=(--execute)
          fi
          # .tmp/ is gitignored, so it does not exist in a fresh CI checkout. Without it,
          # `tee` fails to create the result file, PIPESTATUS[0] masks that failure, and
          # both notify steps silently skip ("no orchestrator result file") — the Owner
          # never learns a release is pending approval (observed: v0.6.0 pending since
          # 2026-06-29, run 28353042537, zero notification issues ever created).
          mkdir -p .tmp
          set +e
          python "${args[@]}" | tee .tmp/release-auto-result.json
          rc=${PIPESTATUS[0]}
          set -e
          echo "orchestrator exit code: $rc"
          if [ ! -s .tmp/release-auto-result.json ]; then
            echo "::error::orchestrator result file was not written; Owner notification would be silently skipped"
            exit 1
          fi
          # Exit 2 = owner-approval-required (minor/major/critical): not a CI failure, it is
          # the designed halt. Surface it but do not fail the workflow. Exit 3 (CI-not-green)
          # and 4 (gate-blocked) are also clean stops with no mutation. Exit 5 means the
          # cadence trigger could not be evaluated at all (git query failures): the cycle was
          # NOT assessed, so fail the step to make the run red — the notify steps below are
          # if: always() and still run. Next scheduled run retries.
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          if [ "$rc" = "5" ]; then
            echo "::error::cadence trigger evaluation failed (git query errors); release cycle was not assessed"
            exit 5
          fi

      - name: Notify the Owner of the auto-release outcome
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          {
            echo "### Noncritical auto-release (TASK-AR-586)"
            echo ""
            if [ -f .tmp/release-auto-result.json ]; then
              result="$(jq -r '.result // "unknown"' .tmp/release-auto-result.json 2>/dev/null || echo unknown)"
              target="$(jq -r '.target_tag // "n/a"' .tmp/release-auto-result.json 2>/dev/null || echo n/a)"
              dry="$(jq -r '.dry_run' .tmp/release-auto-result.json 2>/dev/null || echo unknown)"
              echo "- result: \`$result\`"
              echo "- target: \`$target\`"
              echo "- dry_run: \`$dry\`"
              if [ "$result" = "owner-approval-required" ]; then
                echo ""
                echo "**OWNER ACTION REQUIRED** -- a minor / major-or-breaking release was"
                echo "detected. The agent council does NOT auto-execute this tier. Review and"
                echo "approve explicitly before any tag/push."
              fi
            else
              echo "- result: orchestrator produced no result file (no release attempted)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Open/update the Owner-approval issue (proactive notification)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          VALIDATED_SHA: ${{ steps.validated.outputs.validated_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # The STEP_SUMMARY above is only visible to someone browsing this run. A non-patch
          # release that halts for Owner approval must reach the Owner proactively, so open
          # (or update) a single GitHub issue; close it once a release actually executes.
          if [ ! -f .tmp/release-auto-result.json ]; then
            echo "no orchestrator result file; nothing to surface"; exit 0
          fi
          result="$(jq -r '.result // "unknown"' .tmp/release-auto-result.json)"
          target="$(jq -r '.target_tag // "n/a"' .tmp/release-auto-result.json)"
          dry="$(jq -r '.dry_run' .tmp/release-auto-result.json)"
          reason="$(jq -r '.reason // ""' .tmp/release-auto-result.json)"
          sha="$(jq -r '.head_sha // ""' .tmp/release-auto-result.json)"
          [ -n "$sha" ] || sha="$VALIDATED_SHA"
          bump="$(jq -r '(.blocking_flags // []) | map(select(startswith("recommended_bump:")))[0] // "" | sub("recommended_bump:";"")' .tmp/release-auto-result.json)"
          [ -n "$bump" ] || bump="minor"
          title="[release-auto] Release pending Owner approval"
          existing="$(gh issue list --repo "$REPO" --state open --search "in:title \"$title\"" --json number --jq '.[0].number // empty' 2>/dev/null || echo "")"
          if [ "$result" = "owner-approval-required" ]; then
            {
              echo "An accumulated **$target** (\`$bump\`) release reached the cadence threshold but is **not auto-published** — the agent council only auto-executes \`patch\`/noncritical tiers, so a non-patch release needs your explicit approval."
              echo ""
              echo "- recommended: \`$target\` (\`$bump\`)"
              echo "- validated green SHA: \`$sha\`"
              echo "- reason: $reason"
              echo "- workflow run: $RUN_URL"
              echo ""
              echo "**To approve & publish:** cut the release (\`scripts/release_version_cascade.py --write <version>\` -> PR -> merge -> annotated tag + GitHub release), or comment your go-ahead. This issue auto-closes once a release executes."
            } > /tmp/release-issue-body.md
            if [ -n "$existing" ]; then
              gh issue edit "$existing" --repo "$REPO" --body-file /tmp/release-issue-body.md
              gh issue comment "$existing" --repo "$REPO" --body "Still pending: \`$target\` (\`$bump\`) at \`$sha\` (run $RUN_URL)."
              echo "updated pending-approval issue #$existing"
            else
              gh issue create --repo "$REPO" --title "$title" --body-file /tmp/release-issue-body.md
              echo "opened pending-approval issue"
            fi
          elif [ "$result" = "executed" ] && [ "$dry" = "false" ] && [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$REPO" --body "Released \`$target\` (run $RUN_URL) -- closing."
            gh issue close "$existing" --repo "$REPO"
            echo "closed pending-approval issue #$existing after release"
          fi

      - name: Upload Owner-notification + decision records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-auto-records-${{ github.run_id }}
          path: |
            .tmp/release-auto/**
            .tmp/release-auto-result.json
          if-no-files-found: ignore
