schema_version: agent-runtime-work-schema/v1
schema_owner: planning-office
updated_at: 2026-06-12T13:30:00+09:00
unknown_field_policy: watch
derived_field_policy: computed_only
custom_property_policy: register_here_first

work_kinds:
  - initiative
  - taskset
  - task
  - unit
  - routine
  - spike

closed_resolution_values:
  - done
  - wontfix
  - duplicate
  - superseded
  - moved_to_vault

required_core_fields:
  - schema_version
  - work_id
  - work_uid
  - kind
  - status
  - owner
  - created_at
  - updated_at
  - origin_type
  - origin_ref
  - created_by

minimum_required_by_kind:
  initiative:
    - schema_version
    - work_id
    - work_uid
    - kind
    - status
    - owner
    - created_at
    - updated_at
    - origin_type
    - origin_ref
    - created_by
  taskset:
    - schema_version
    - work_id
    - work_uid
    - kind
    - parent_id
    - status
    - owner
    - created_at
    - updated_at
    - origin_type
    - origin_ref
    - created_by
  task:
    - schema_version
    - work_id
    - work_uid
    - kind
    - parent_id
    - status
    - owner
    - created_at
    - updated_at
    - origin_type
    - origin_ref
    - created_by
  unit:
    - schema_version
    - work_id
    - work_uid
    - kind
    - parent_id
    - status
    - owner
    - created_at
    - updated_at
    - origin_type
    - origin_ref
    - created_by
    - verification_status
  routine:
    - schema_version
    - work_id
    - work_uid
    - kind
    - status
    - owner
    - created_at
    - updated_at
    - origin_type
    - origin_ref
    - created_by
  spike:
    - schema_version
    - work_id
    - work_uid
    - kind
    - parent_id
    - status
    - owner
    - created_at
    - updated_at
    - origin_type
    - origin_ref
    - created_by

required_when_closed:
  - resolution
  - completed_at
  - verification_status

computed_only_fields:
  progress_pct:
    storage_policy: computed_only
    computed_from: child_status_rollup
  age:
    storage_policy: computed_only
    computed_from: created_at_and_now
  lead_time:
    storage_policy: computed_only
    computed_from: started_at_and_completed_at
  est_actual_delta:
    storage_policy: computed_only
    computed_from: estimate_minus_actual
  rollup_progress_pct:
    storage_policy: computed_only
    computed_from: child_progress_pct

fields:
  schema_version:
    type: string
    required_for: [initiative, taskset, task, unit, routine, spike]
    populated_by: work_cli
    consumed_by: [work_schema_gate, work_cli, migration_tools]
    query_use: Distinguish envelope versions during gradual migration.
    mutable: false
  work_id:
    type: string
    required_for: [initiative, taskset, task, unit, routine, spike]
    populated_by: work_cli
    consumed_by: [work_cli, work_item_classifier, board, stats]
    query_use: Stable human-searchable ID for one work item.
    mutable: false
  work_uid:
    type: uuid
    required_for: [initiative, taskset, task, unit, routine, spike]
    populated_by: work_cli
    consumed_by: [work_cli, gates, stats]
    query_use: Collision-resistant identity independent of display labels.
    mutable: false
  kind:
    type: enum
    required_for: [initiative, taskset, task, unit, routine, spike]
    populated_by: work_cli
    consumed_by: [work_schema_gate, work_cli, board, stats]
    query_use: Filter and validate records by work item kind.
    mutable: false
  parent_id:
    type: string
    required_for: [taskset, task, unit, spike]
    populated_by: work_cli
    consumed_by: [work_item_classifier, orphan_gate, board]
    query_use: Traverse initiative to taskset to task to unit lineage.
    mutable: planner_only
  status:
    type: enum
    required_for: [initiative, taskset, task, unit, routine, spike]
    populated_by: work_cli
    consumed_by: [board, gates, stats]
    query_use: Filter active, blocked, closed, and waiting work.
    mutable: lifecycle_tools
  resolution:
    type: enum
    required_for: []
    populated_by: work_close
    consumed_by: [work_close, stats, vault_gate]
    query_use: Separate done from duplicate, superseded, wontfix, or vault moves.
    mutable: closeout_only
  owner:
    type: string
    required_for: [initiative, taskset, task, unit, routine, spike]
    populated_by: planner
    consumed_by: [board, assigner, stats]
    query_use: Group accountability by owner role or team.
    mutable: planner_only
  team:
    type: string
    required_for: []
    populated_by: planner
    consumed_by: [assigner, workload_stats, board]
    query_use: Filter and balance work by team.
    mutable: planner_only
  created_at:
    type: datetime
    required_for: [initiative, taskset, task, unit, routine, spike]
    populated_by: work_cli
    consumed_by: [board, stats, stale_gate]
    query_use: Calculate age and intake trends.
    mutable: false
  started_at:
    type: datetime
    required_for: []
    populated_by: claim_dispatcher
    consumed_by: [task_identity_gate, stats]
    query_use: Calculate queue time and lead time.
    mutable: lifecycle_tools
  updated_at:
    type: datetime
    required_for: [initiative, taskset, task, unit, routine, spike]
    populated_by: work_cli
    consumed_by: [board, stale_gate, stats]
    query_use: Detect stale records and recent changes.
    mutable: lifecycle_tools
  completed_at:
    type: datetime
    required_for: []
    populated_by: work_close
    consumed_by: [task_identity_gate, stats]
    query_use: Calculate cycle time and closeout history.
    mutable: closeout_only
  closed_by:
    type: string
    required_for: []
    populated_by: work_close
    consumed_by: [audit, stats]
    query_use: Attribute closeout to the concrete tool, actor, or agent instance that closed the item.
    mutable: closeout_only
  origin_type:
    type: enum
    required_for: [initiative, taskset, task, unit, routine, spike]
    populated_by: planner
    consumed_by: [stats, board]
    query_use: Compare owner_request, planning_proposal, doc_intake, retro, and automation_rule origins.
    mutable: planner_only
  origin_ref:
    type: string
    required_for: [initiative, taskset, task, unit, routine, spike]
    populated_by: planner
    consumed_by: [review_index, stats, board]
    query_use: Link each work item to the request, review, issue, document, or automation source that created it.
    mutable: planner_only
  created_by:
    type: string
    required_for: [initiative, taskset, task, unit, routine, spike]
    populated_by: work_cli
    consumed_by: [audit, stats]
    query_use: Attribute creation to Owner, pane, tool, or agent instance.
    mutable: false
  created_by_instance:
    type: string
    required_for: []
    populated_by: agent_identity
    consumed_by: [audit, agent_stats]
    query_use: Attribute generated records to a concrete agent instance, not just a role.
    mutable: false
  last_actor_instance:
    type: string
    required_for: []
    populated_by: lifecycle_tools
    consumed_by: [audit, agent_stats]
    query_use: Trace the most recent concrete actor that changed the item.
    mutable: lifecycle_tools
  split_from:
    type: list
    required_for: []
    populated_by: work_split
    consumed_by: [stats, review_index]
    query_use: Measure decomposition quality and rework after task splitting.
    mutable: planner_only
  supersedes:
    type: list
    required_for: []
    populated_by: planner
    consumed_by: [dedup_gate, review_index]
    query_use: Preserve decision history when one item replaces another.
    mutable: planner_only
  duplicate_of:
    type: string
    required_for: []
    populated_by: planner
    consumed_by: [dedup_gate, stats]
    query_use: Collapse duplicate intake without losing traceability.
    mutable: planner_only
  summary:
    type: string
    required_for: []
    populated_by: planner
    consumed_by: [board, search, explorer]
    query_use: Show one-line search and hover summaries without parsing prose bodies.
    mutable: planner_only
  tags:
    type: list
    required_for: []
    populated_by: planner
    consumed_by: [search, board, stats]
    query_use: Filter by topic, capability, risk, or tool surface.
    mutable: planner_only
  area:
    type: string
    required_for: []
    populated_by: planner
    consumed_by: [assigner, stats, search]
    query_use: Find open work by product or repository area.
    mutable: planner_only
  component:
    type: string
    required_for: []
    populated_by: planner
    consumed_by: [assigner, code_owner_gate, stats]
    query_use: Find work by concrete module, script, package, or document surface.
    mutable: planner_only
  planner_model_tier:
    type: enum
    required_for: []
    populated_by: planner
    consumed_by: [dispatcher, model_routing, stats]
    query_use: Route planning and decomposition to an appropriate model tier.
    mutable: planner_only
  worker_model_tier:
    type: enum
    required_for: []
    populated_by: planner
    consumed_by: [dispatcher, model_routing, stats]
    query_use: Route routine implementation to a cost-appropriate worker.
    mutable: planner_only
  reviewer_model_tier:
    type: enum
    required_for: []
    populated_by: planner
    consumed_by: [dispatcher, model_routing, stats]
    query_use: Select verification strength for the item risk.
    mutable: planner_only
  risk_tier:
    type: enum
    required_for: []
    populated_by: planner
    consumed_by: [approval_gate, reviewer_router, stats]
    query_use: Filter high-risk work and compare risk-adjusted failure rates.
    mutable: planner_only
  approval_required:
    type: boolean
    required_for: []
    populated_by: planner
    consumed_by: [approval_gate, dispatcher]
    query_use: Hold external, destructive, or high-risk work before execution.
    mutable: planner_only
  security_sensitive:
    type: boolean
    required_for: []
    populated_by: planner
    consumed_by: [security_gate, reviewer_router]
    query_use: Force stronger review for secret, auth, data, or security boundaries.
    mutable: planner_only
  stakeholders:
    type: list
    required_for: []
    populated_by: planner
    consumed_by: [notifications, board]
    query_use: Notify interested roles when the item changes.
    mutable: planner_only
  watchers:
    type: list
    required_for: []
    populated_by: planner
    consumed_by: [notifications, board]
    query_use: Let optional subscribers follow changes without owning the work.
    mutable: planner_only
  due_date:
    type: date
    required_for: []
    populated_by: planner
    consumed_by: [flow_stats, board]
    query_use: Identify overdue work and horizon risk.
    mutable: planner_only
  blocked_since:
    type: datetime
    required_for: []
    populated_by: lifecycle_tools
    consumed_by: [flow_stats, board]
    query_use: Measure blocked time and stale work.
    mutable: lifecycle_tools
  blocks:
    type: list
    required_for: []
    populated_by: planner
    consumed_by: [dependency_graph, board]
    query_use: Build dependency and critical-path views.
    mutable: planner_only
  blocked_by:
    type: list
    required_for: []
    populated_by: planner
    consumed_by: [dependency_graph, board]
    query_use: Explain why work cannot start or close.
    mutable: planner_only
  relates_to:
    type: list
    required_for: []
    populated_by: planner
    consumed_by: [search, graph]
    query_use: Keep non-blocking relationships queryable.
    mutable: planner_only
  evidence_refs:
    type: list
    required_for: []
    populated_by: work_close
    consumed_by: [evidence_index, closeout_gate]
    query_use: Prove completed work has linked evidence.
    mutable: closeout_only
  review_refs:
    type: list
    required_for: []
    populated_by: planner_or_reviewer
    consumed_by: [review_index, owner_doc_gate]
    query_use: Link planning, review, and closeout records.
    mutable: lifecycle_tools
  commit_refs:
    type: list
    required_for: []
    populated_by: closeout_tools
    consumed_by: [search, release_notes]
    query_use: Trace which commits changed an item.
    mutable: closeout_only
  pr_refs:
    type: list
    required_for: []
    populated_by: closeout_tools
    consumed_by: [search, release_notes]
    query_use: Trace which PRs delivered an item.
    mutable: closeout_only
  a2a_context_id:
    type: string
    required_for: []
    populated_by: a2a_router
    consumed_by: [a2a_trace_gate, audit]
    query_use: Connect work to agent-to-agent decision chains.
    mutable: lifecycle_tools
  claim_refs:
    type: list
    required_for: []
    populated_by: claim_dispatcher
    consumed_by: [parallel_worktree_gate, audit, stats]
    query_use: Link work to runtime claims and pane handoffs.
    mutable: lifecycle_tools
  est_tokens:
    type: integer
    required_for: []
    populated_by: planner
    consumed_by: [budget_gate, stats]
    query_use: Estimate model cost before execution.
    mutable: planner_only
  actual_tokens:
    type: integer
    required_for: []
    populated_by: work_close
    consumed_by: [budget_gate, stats]
    query_use: Measure actual token spend after closeout.
    mutable: closeout_only
  actual_hours:
    type: decimal
    required_for: []
    populated_by: work_close
    consumed_by: [budget_gate, flow_stats, stats]
    query_use: Measure actual human or agent elapsed effort after closeout.
    mutable: closeout_only
  est_cost:
    type: decimal
    required_for: []
    populated_by: planner
    consumed_by: [budget_gate, stats]
    query_use: Estimate money cost before execution.
    mutable: planner_only
  actual_cost:
    type: decimal
    required_for: []
    populated_by: work_close
    consumed_by: [budget_gate, stats]
    query_use: Measure actual money cost after closeout.
    mutable: closeout_only
  budget_cap:
    type: decimal
    required_for: []
    populated_by: planner
    consumed_by: [budget_gate, dispatcher]
    query_use: Stop or escalate work before it exceeds an approved cap.
    mutable: planner_only
  rework_count:
    type: integer
    required_for: []
    populated_by: gate_or_reviewer
    consumed_by: [stats, model_routing]
    query_use: Compare quality by team, role, model tier, or skill version.
    mutable: lifecycle_tools
  gate_failure_count:
    type: integer
    required_for: []
    populated_by: gates
    consumed_by: [stats, model_routing]
    query_use: Identify repeated failure patterns and routing adjustments.
    mutable: lifecycle_tools
  verification_status:
    type: enum
    required_for: [unit]
    populated_by: work_verify
    consumed_by: [closeout_gate, board, stats]
    query_use: Show pass, fail, blocked, or stale verification state.
    mutable: lifecycle_tools
  verified_at:
    type: datetime
    required_for: []
    populated_by: work_verify
    consumed_by: [stale_verification_gate, stats]
    query_use: Detect stale verification after source changes.
    mutable: lifecycle_tools
  verified_by:
    type: string
    required_for: []
    populated_by: work_verify
    consumed_by: [audit, stats]
    query_use: Attribute verification to an actor, tool, or agent instance.
    mutable: lifecycle_tools
  xp_value:
    type: integer
    required_for: []
    populated_by: stats_engine
    consumed_by: [gamification, stats]
    query_use: Cache score outputs from measured completion and quality signals.
    mutable: computed_cache
