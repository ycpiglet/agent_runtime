growth_automation_policy:
  allowed:
    - owned-channel scheduled posting
    - approved API posting
    - consent-based CRM follow-up
    - SEO/content analysis
    - campaign performance reporting
  prohibited:
    - viewbots
    - fake traffic or fake engagement
    - unauthorized bulk posting
    - spam
    - terms-of-service evasion
    - platform manipulation

business_operating_cycle_policy:
  required_artifacts:
    - review
    - seminar
    - scribe
    - doc-steward review
    - compound
    - retro
    - W4 verification evidence
  next_taskset_rule: New business work must be registered through `python scripts/work.py new --input <json>` before implementation.
  execution_boundary: Implementation must happen inside a claimed worktree; adjacent problems go to intake registration.
  prohibited_without_owner_approval:
    - external accounting-system writes
    - CRM mutation or outbound sales contact
    - support desk mutation or direct customer support send
    - payment or contract mutation
    - scraping, spam, or platform manipulation
    - unsupported automation outside the recorded task unit

