<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Agent Characters -- v2 Preview (Office Map)</title>
<!-- STANDALONE preview (no build, no network). Open directly. Sprites are
     the original .svg files in this directory; the house palette is mirrored
     below so they render in in-console colors. -->
<style>
  :root {
    color-scheme: light;
    --canvas:#ffffff; --paper:#ffffff; --panel:#f7f7f5; --panel-strong:#f1f1ef;
    --ink:#37352f; --muted:#787774; --subtle:#9b9a97; --line:#e9e9e7;
    --line-strong:#d3d1cb; --primary:#2e6fdb; --success:#0f7b55;
    --warning:#cb7509; --danger:#e03e3e; --teal:#0f7b55; --amber:#cb7509;
    --violet:#6a48c9; --primary-soft:#dde8f9; --success-soft:#d6ece4;
    --warning-soft:#f4e3cc; --danger-soft:#f8dcdc; --teal-soft:#d6ece4;
    --violet-soft:#e6def5; --raise-strong:#ededeb;
    --office-room-bg:var(--panel); --office-room-line:var(--line-strong);
    --office-skin:#f6caa6; --office-skin-shade:#e0a878; --office-hair:#5b4636;
  }
  [data-theme="dark"] {
    color-scheme: dark;
    --canvas:#010102; --paper:#010102; --panel:#0f1011; --panel-strong:#15171a;
    --ink:#f7f8f8; --muted:#a2a8b3; --subtle:#62666d; --line:#23252a;
    --line-strong:#343844; --primary:#5e6ad2; --success:#27a644;
    --warning:#d99a2b; --danger:#f04438; --teal:#31d0aa; --amber:#d99a2b;
    --violet:#5e6ad2; --primary-soft:#1f2433; --success-soft:#163322;
    --warning-soft:#3a2c12; --danger-soft:#3a1614; --teal-soft:#10332b;
    --violet-soft:#1f2433; --raise-strong:#1a1c20;
    --office-skin:#e7b489; --office-skin-shade:#c9925f; --office-hair:#4a3a2c;
  }
  *{box-sizing:border-box;} body{margin:0;background:var(--canvas);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;line-height:1.5;}
  header{padding:20px 24px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:16px;}
  header h1{font-size:18px;margin:0;} header p{margin:4px 0 0;color:var(--muted);font-size:13px;}
  button{font:inherit;padding:6px 12px;border:1px solid var(--line-strong);border-radius:8px;background:var(--panel);color:var(--ink);cursor:pointer;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px;padding:24px;}
  .card{margin:0;display:flex;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-top:3px solid var(--line-strong);border-radius:12px;background:var(--office-room-bg);}
  .card.token-violet{border-top-color:var(--violet);} .card.token-primary{border-top-color:var(--primary);}
  .card.token-teal{border-top-color:var(--teal);} .card.token-success{border-top-color:var(--success);}
  .card.token-warning{border-top-color:var(--warning);} .card.token-amber{border-top-color:var(--amber);}
  .card.token-danger{border-top-color:var(--danger);} .card.token-muted{border-top-color:var(--muted);}
  .card:hover,.card:focus{outline:2px solid var(--primary);outline-offset:2px;}
  .sprite{flex:0 0 auto;width:56px;height:56px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:var(--panel-strong);border:2px solid var(--line-strong);}
  .sprite img{image-rendering:pixelated;width:48px;height:48px;}
  figcaption{display:flex;flex-direction:column;min-width:0;} figcaption b{font-size:13px;}
  .prop{font-size:11px;color:var(--muted);} .status{font-size:11px;color:var(--success);font-weight:600;}
</style>
</head>

<header><div><h1>Agent Characters -- v2 (chibi, filled + colourful)</h1><p>Original pixel art. Hover/focus a card for the role . status . task tooltip.</p></div><button onclick="document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark'">Toggle theme</button></header>
