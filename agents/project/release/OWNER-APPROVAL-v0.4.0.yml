  - feat(eval): cross-version self-eval metrics harness (#128 partial) [PR #193]
  - feat(scripts): upstream doc_steward_due from autofolio + cycle_status guard [PR #194]
  - feat(guards): template-lock drift catcher + safe destructive-ref wrapper [PR #192]
  - feat(release): release-version-cascade check/bump tool [PR #191]
  - docs(compound): v0.3.x release/concurrency casebook + reviews [PR #190]
required_owner_decision:
  - approve_release_execution
  - hold_at_ready
