status: owner_approved
owner: owner
decision_date: 2026-06-22
approved_by: owner
approval_basis: >
  User directive (2026-06-22): "autofolio 쪽 시임 해제까지 이어서 진행해줘" — to drop
  autofolio's doc_steward_due seam, the upstream generalization must ship in a tag
