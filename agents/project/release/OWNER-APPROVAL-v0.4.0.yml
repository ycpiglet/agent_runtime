owner_decision: approve_release_execution
notes: >
  Minor release: additive tooling + a consumer-gate generalization (doc_steward_due)
  with no breaking changes. Bumped atomically via the new release_version_cascade tool
  (the prevention shipped in v0.3.x-cycle compound). After tagging, autofolio drops its
  doc_steward_due seam and re-syncs at v0.4.0 (same loop as #185 -> v0.3.1).
